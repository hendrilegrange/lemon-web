name: Diagnose FTP certificate

# Temporary: read-only check of the FTP server's certificate chain and login. Uploads nothing.
on:
  pull_request:
    paths:
      - .github/workflows/ftp-diagnose.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Check the secret and the certificate chain
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          [ "$FTP_SERVER" = "bloodlust.aserv.co.za" ] && echo "FTP_SERVER is exactly bloodlust.aserv.co.za" || echo "FTP_SERVER is NOT exactly bloodlust.aserv.co.za (length ${#FTP_SERVER})"
          host=bloodlust.aserv.co.za
          echo "== Chain from $host:21"
          echo | timeout 30 openssl s_client -starttls ftp -connect "$host:21" -servername "$host" -showcerts 2>/dev/null \
            | awk '/BEGIN CERT/{c++} c{print > ("/tmp/c" c ".pem")}' || true
          for f in /tmp/c[0-9]*.pem; do openssl x509 -in "$f" -noout -subject -issuer -enddate -fingerprint -sha1 2>/dev/null; echo; done
          echo "== Login and list with lftp (read-only)"
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; set net:max-retries 1; set net:timeout 20; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$host\"; cls -1" 2>&1 | head -20 || true
