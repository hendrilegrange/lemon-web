name: Deploy to live site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# The workflow token only needs to read the code
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 100      # enough history to find the last merged pull request

      # The version on the title screen: v1.0 and the last merged PR's number. Written here,
      # not kept in git, so nobody has to bump it.
      - name: Write version.json
        run: |
          echo "{\"version\":\"$(.github/scripts/version.sh)\"}" > version.json
          cat version.json

      - name: JavaScript syntax check
        run: |
          for f in $(git ls-files 'js/*.js'); do node --check "$f" || exit 1; done

      - name: PHP syntax check
        run: |
          for f in $(git ls-files '*.php'); do php -l "$f" || exit 1; done

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp instead of FTP-Deploy-Action: the IIS FTP server drops that action's
      # encrypted data connections. Uploads the site files and never deletes them; the
      # only thing it removes is a stray .git folder, which never belongs on the server.
      # Directory excludes need the trailing slash. --no-perms: IIS has no SITE CHMOD.
      - name: Upload over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 30;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            rm -r -f \"${FTP_SERVER_DIR}.git\";
            mirror --reverse --verbose --parallel=2 --no-perms \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .gitignore \
              --exclude-glob CLAUDE.md \
              --exclude-glob README.md \
              --exclude-glob docs/ \
              --exclude-glob tests/ \
              --exclude-glob *.bak \
              --exclude-glob config.php \
              --exclude-glob config.example.php \
              ./ \"$FTP_SERVER_DIR\"
          "

  smoke-test:
    needs: deploy
    uses: ./.github/workflows/smoke-test.yml
    with:
      check_files: true
    secrets: inherit
